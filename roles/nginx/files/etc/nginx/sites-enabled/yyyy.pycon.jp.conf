server {
    listen 80;
    server_name 2024.pycon.jp;

    root /var/www/pyconjp/2024.pycon.jp;
    index index.html;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Redirect the root path to the Japanese site
    location = / {
        return 301 /ja;
    }

    # Serve the exported HTML under /ja and /en.
    # Next.js exports each page as `<path>.html`, so `$uri.html` is tried as well.
    location ~ ^/(ja|en)(/|$) {
        try_files $uri $uri.html =404;
    }

    # Serve static assets (/_next, /sponsors, /conference, favicon.ico, ...) as-is,
    # and fall back to the Japanese site for anything else.
    location / {
        try_files $uri $uri.html @redirect_to_ja;
    }

    location @redirect_to_ja {
        return 301 /ja$request_uri;
    }
}

