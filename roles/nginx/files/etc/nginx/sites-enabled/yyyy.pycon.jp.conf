server {
    listen 80;
    server_name 2025.pycon.jp;

    root /var/www/pyconjp/2025.pycon.jp;
    index index.html;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Redirect the root path to the Japanese site
    location = / {
        return 301 /ja;
    }

    # The timetable index is a client-side redirect page, so redirect it here
    location = /ja/timetable {
        return 301 /ja/timetable/day1;
    }

    location = /en/timetable {
        return 301 /en/timetable/day1;
    }

    # Serve the exported HTML under /ja and /en
    location ~ ^/(ja|en)(/|$) {
        try_files $uri $uri.html $uri/ =404;
    }

    # Serve static assets (/_next, /common, sitemap.xml, robots.txt) as-is,
    # and fall back to the Japanese site for anything else
    location / {
        try_files $uri $uri.html $uri/ @redirect_to_ja;
    }

    location @redirect_to_ja {
        return 301 /ja$request_uri;
    }
}

